name: Keepalive

# GitHub auto-disables scheduled workflows after 60 days without repository
# activity. That is exactly what silently killed "Update Vector Database" (last
# commit Feb 27 -> disabled late April -> no seed for months -> stale data).
#
# This job runs every ~3 weeks (well under the 60-day limit) and pushes a single
# empty commit to reset the inactivity timer, keeping ALL scheduled workflows
# (including the seed) alive. Use workflow_dispatch to also re-arm manually.

on:
  schedule:
    # 07:00 UTC on the 1st and 21st of each month (max ~20-day gap)
    - cron: "0 7 1,21 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push empty commit to reset the 60-day inactivity timer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive — prevent scheduled-workflow auto-disable [skip ci]"
          git push
